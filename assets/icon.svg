<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset=".55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#ring)" stroke-width="8" opacity=".55"/>

  <!-- heartbeat pulse line -->
  <polyline points="64,272 160,272 200,180 248,340 292,232 328,272 448,272"
            fill="none" stroke="url(#pulse)" stroke-width="26"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- status dot (green = UP) -->
  <circle cx="400" cy="152" r="34" fill="#34d399"/>
  <circle cx="400" cy="152" r="34" fill="none" stroke="#0f172a" stroke-width="10"/>
  <circle cx="400" cy="152" r="52" fill="#34d399" opacity=".18"/>

  <!-- SSL padlock shackle -->
  <path d="M 196 404 v-28 a 44 44 0 0 1 88 0 v 28"
        fill="none" stroke="#fbbf24" stroke-width="20" stroke-linecap="round"/>
  <!-- SSL padlock body -->
  <rect x="180" y="400" width="120" height="76" rx="18" fill="#fbbf24"/>
  <circle cx="240" cy="432" r="12" fill="#0f172a"/>
  <rect x="233" y="432" width="14" height="22" rx="7" fill="#0f172a"/>
</svg>
